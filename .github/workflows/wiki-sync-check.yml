# PR 에서 Wiki 갱신 누락을 검사해요. (scripts/check-wiki-sync.mjs)
# Claude 의 push / PR 생성 직전 훅(.claude/hooks/check-wiki-sync.sh)과 같은 검사를, 사람이 만든 커밋에도 적용하려는 용도예요.
#
# - 룰셋의 필수 체크로는 등록하지 않았어요. (실패해도 PR 화면에 표시만 하고 머지는 막지 않아요)
# - Wiki 에 반영할 내용이 없으면 커밋 footer 에 `Wiki-Skip: <이유>` 를 남겨요.
#
# 함께 수정해야 하는 곳: 검사 규칙은 scripts/check-wiki-sync.mjs 의 RULES 하나만 봐요.
name: Wiki sync check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: wiki-sync-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  wiki-sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # base...head 비교에 필요해요

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # 의존성이 없는 스크립트라 pnpm install 은 하지 않아요.
      - name: Wiki 갱신 누락 검사
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-wiki-sync.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
