# main 의 docs/wiki/ 를 GitHub Wiki 저장소로 동기화해요.
# Wiki 의 원본은 docs/wiki/ 이고, Wiki 를 웹에서 직접 고치면 다음 동기화 때 덮어써져요.
#
# 함께 수정해야 하는 곳: 원본 경로(docs/wiki)를 바꾸면 아래 paths / SOURCE_DIR,
# AGENTS.md 의 Wiki 규칙, docs/wiki/_Footer.md 의 링크를 함께 수정해요.
name: Wiki sync

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/wiki-sync.yml"
  workflow_dispatch:

permissions:
  contents: write # Wiki 저장소 push 에 필요

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SOURCE_DIR: docs/wiki
    steps:
      - uses: actions/checkout@v4

      - name: Wiki 저장소 clone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            "$RUNNER_TEMP/wiki"

      - name: docs/wiki 내용 반영
        run: rsync -a --delete --exclude '.git' "$SOURCE_DIR/" "$RUNNER_TEMP/wiki/"

      - name: 변경 사항 commit / push
        run: |
          cd "$RUNNER_TEMP/wiki"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki 에 반영할 변경 사항이 없어요."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "docs: ${GITHUB_REPOSITORY}@${GITHUB_SHA::7} 기준 Wiki 동기화"
          git push origin HEAD
          git diff --stat HEAD~1 HEAD >> "$GITHUB_STEP_SUMMARY" || true
